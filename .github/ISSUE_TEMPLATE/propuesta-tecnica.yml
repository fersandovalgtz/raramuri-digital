name: Propuesta o problema técnico
about: Reportar una falla reproducible o proponer una mejora de software, API, pruebas o automatización
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Gracias por contribuir a Rarámuri Digital. No incluya datos personales, credenciales ni información culturalmente sensible.

  - type: dropdown
    id: type
    attributes:
      label: Tipo de reporte
      options:
        - Falla reproducible
        - Mejora de la API
        - Mejora de interfaz o accesibilidad
        - Pruebas y calidad
        - Exportaciones o interoperabilidad
        - Dependencias o mantenimiento
        - Otra propuesta técnica
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Componente, archivo o URL
      placeholder: app/, scripts/, API, URL o ruta afectada
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Comportamiento actual
      description: Describa qué ocurre y los pasos mínimos para reproducirlo.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado o mejora propuesta
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia técnica
      description: Incluya registros, capturas, referencias, pruebas o ejemplos no sensibles.

  - type: input
    id: version
    attributes:
      label: Versión, commit o entorno
      placeholder: Plataforma 3.1.0, main, navegador, Node.js, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmaciones
      options:
        - label: Verifiqué que no existe una incidencia equivalente.
          required: true
        - label: No incluí información privada, credenciales ni materiales culturalmente sensibles.
          required: true
        - label: Comprendo que la aceptación técnica no constituye validación lingüística o cultural.
          required: true
