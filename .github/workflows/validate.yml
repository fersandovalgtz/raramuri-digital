name: Validar publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validar-publicacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Validar CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-pdf.txt
            requirements-cldf.txt

      - name: Validar metadatos JSON
        run: |
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool project-metadata.json >/dev/null
          python -m json.tool public/downloads/manifest.json >/dev/null

      - name: Instalar dependencias
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils libxml2-utils
          python -m pip install -r requirements-pdf.txt -r requirements-cldf.txt

      - name: Regenerar exportaciones
        run: npm run data:exports

      - name: Comprobar determinismo de capas tipadas y P-21
        run: |
          mkdir -p .tmp/typed-pass-1
          cp data/variants-typed.json .tmp/typed-pass-1/variants-typed.json
          cp data/lexical-relations.json .tmp/typed-pass-1/lexical-relations.json
          cp data/graphic-variants.json .tmp/typed-pass-1/graphic-variants.json
          cp data/graphic-variants.csv .tmp/typed-pass-1/graphic-variants.csv
          cp data/graphic-variants-report.json .tmp/typed-pass-1/graphic-variants-report.json
          cp data/advanced-products.json .tmp/typed-pass-1/advanced-products.json
          cp data/advanced-products-report.json .tmp/typed-pass-1/advanced-products-report.json
          node scripts/generate-typed-variants.mjs
          node scripts/extract-graphic-variants.mjs
          node --experimental-strip-types --no-warnings scripts/extract-advanced-products.mjs
          node scripts/reconcile-remission-product.mjs
          cmp .tmp/typed-pass-1/variants-typed.json data/variants-typed.json
          cmp .tmp/typed-pass-1/lexical-relations.json data/lexical-relations.json
          cmp .tmp/typed-pass-1/graphic-variants.json data/graphic-variants.json
          cmp .tmp/typed-pass-1/graphic-variants.csv data/graphic-variants.csv
          cmp .tmp/typed-pass-1/graphic-variants-report.json data/graphic-variants-report.json
          cmp .tmp/typed-pass-1/advanced-products.json data/advanced-products.json
          cmp .tmp/typed-pass-1/advanced-products-report.json data/advanced-products-report.json

      - name: Verificar nombre canónico del responsable
        run: node scripts/check-canonical-name.mjs

      - name: Validar CLDF con pycldf
        run: python -m pycldf validate public/downloads/cldf/cldf-metadata.json

      - name: Comprobar determinismo CLDF
        run: |
          npm run data:cldf -- --output .tmp/cldf-1
          npm run data:cldf -- --output .tmp/cldf-2
          diff -ru .tmp/cldf-1 .tmp/cldf-2
          python -m pycldf validate .tmp/cldf-1/cldf-metadata.json

      - name: Comprobar determinismo del perfil ortográfico
        run: |
          npm run data:orthography -- --output .tmp/orthography-1
          npm run data:orthography -- --output .tmp/orthography-2
          diff -ru .tmp/orthography-1 .tmp/orthography-2

      - name: Descargar esquema oficial TEI Lex-0
        run: |
          mkdir -p .tmp/tei-lex0
          curl --fail --location --retry 3 --retry-all-errors \
            https://lex-0.org/schema/lex-0.xsd \
            --output .tmp/tei-lex0/lex-0.xsd
          curl --fail --location --retry 3 --retry-all-errors \
            https://lex-0.org/schema/xml.xsd \
            --output .tmp/tei-lex0/xml.xsd

      - name: Validar TEI Lex-0 contra esquema oficial
        run: xmllint --noout --schema .tmp/tei-lex0/lex-0.xsd public/downloads/raramuri-lex0.xml

      - name: Generar y validar interoperabilidad candidata 1.1.0
        run: |
          node scripts/generate-candidate-interoperability.mjs --output .tmp/candidate-interop-1
          node scripts/generate-candidate-interoperability.mjs --output .tmp/candidate-interop-2
          diff -ru .tmp/candidate-interop-1 .tmp/candidate-interop-2
          python -m pycldf validate .tmp/candidate-interop-1/cldf/cldf-metadata.json
          xmllint --noout --schema .tmp/tei-lex0/lex-0.xsd .tmp/candidate-interop-1/raramuri-lex0-1.1.0-candidate.xml

      - name: Publicar artefactos candidatos 1.1.0 para inspección reproducible
        uses: actions/upload-artifact@v4
        with:
          name: raramuri-interoperability-1.1.0-candidate-${{ github.sha }}
          path: .tmp/candidate-interop-1/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artefactos técnicos para revisión
        uses: actions/upload-artifact@v4
        with:
          name: raramuri-interoperability-${{ github.sha }}
          path: |
            public/downloads/cldf/
            public/downloads/orthography/
          if-no-files-found: error
          retention-days: 30

      - name: Regenerar informe de calidad
        run: npm run data:quality

      - name: Ejecutar auditoría profunda del corpus
        run: node scripts/audit-lexicon-corpus.mjs --output .tmp/corpus-audit

      - name: Publicar auditoría profunda para revisión
        uses: actions/upload-artifact@v4
        with:
          name: raramuri-corpus-audit-${{ github.sha }}
          path: |
            .tmp/corpus-audit/
            data/variants-typed.json
            data/lexical-relations.json
            data/lexical-relation-target-adjudications.json
            data/graphic-variants.json
            data/graphic-variants.csv
            data/graphic-variants-report.json
            data/advanced-products.json
            data/advanced-products-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Verificar reproducibilidad de datos versionados
        run: git diff --exit-code -- public/downloads QUALITY_REPORT.md

      - name: Probar generador PDF y determinismo
        run: |
          python scripts/generate-pdf-exports.py --output .tmp/pdf-1 --max-entries 25 --no-alphabetical
          python scripts/generate-pdf-exports.py --output .tmp/pdf-2 --max-entries 25 --no-alphabetical
          cmp .tmp/pdf-1/raramuri-lexico-completo.pdf .tmp/pdf-2/raramuri-lexico-completo.pdf
          cmp .tmp/pdf-1/manifest-pdf.json .tmp/pdf-2/manifest-pdf.json
          pdfinfo .tmp/pdf-1/raramuri-lexico-completo.pdf >/dev/null

      - name: Analizar código
        run: npm run lint

      - name: Compilar y probar
        run: npm test

      - name: Versionar capas derivadas deterministas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/generate-typed-variants.mjs
            node scripts/extract-graphic-variants.mjs
            node --experimental-strip-types --no-warnings scripts/extract-advanced-products.mjs
            node scripts/reconcile-remission-product.mjs
            git add data/variants-typed.json data/lexical-relations.json data/graphic-variants.json data/graphic-variants.csv data/graphic-variants-report.json data/advanced-products.json data/advanced-products-report.json
            if git diff --cached --quiet; then
              echo "Las capas derivadas ya están versionadas en el main más reciente."
              exit 0
            fi
            git commit -m "Refresh canonical lexical relation products"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main avanzó durante el writeback; reintentando sobre el nuevo HEAD ($attempt/3)."
            sleep 2
          done
          echo "No fue posible versionar las capas derivadas tras tres reintentos."
          exit 1