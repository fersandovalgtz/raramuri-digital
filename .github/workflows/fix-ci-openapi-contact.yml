name: Fix CI OpenAPI reproducibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ci-openapi-contact.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate canonical OpenAPI export
        run: |
          npm ci
          npm run data:exports
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "public/downloads/openapi-lexico.json"
      - name: Commit canonical export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/openapi-lexico.json
          git commit -m 'fix: regenerate canonical OpenAPI export'
          git push
