name: Remove temporary CI repair workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ci-openapi-contact.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/fix-ci-openapi-contact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/fix-ci-openapi-contact.yml
          git commit -m 'chore: remove temporary CI repair workflow [skip ci]'
          git push
