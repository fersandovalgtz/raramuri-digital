name: Fix DOI badge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-doi-badge.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace Zenodo-hosted DOI badge image
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://zenodo.org/badge/DOI/10.5281/zenodo.21483353.svg'
          new = 'https://img.shields.io/badge/DOI-10.5281%2Fzenodo.21483353-1682D4?style=flat-square'

          for filename in ('README.md', 'README.en.md'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected Zenodo badge URL not found in {filename}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'Updated {filename}')
          PY

      - name: Commit badge repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md
          git commit -m 'docs: serve DOI badge through Shields.io [skip ci]'
          git push
