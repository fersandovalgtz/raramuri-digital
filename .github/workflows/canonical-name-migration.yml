name: Migrar nombre canónico

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/canonical-name-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install -r requirements-pdf.txt

      - name: Normalizar generadores
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "Fernando Sandoval Gutiérrez"
          new = "Fernando Sandoval Gutierrez"
          paths = [
              Path("scripts/generate-interoperability-exports.mjs"),
              Path("scripts/generate-pdf-exports.py"),
          ]
          total = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"Expected deprecated spelling in {path}, found none")
              path.write_text(text.replace(old, new), encoding="utf-8")
              total += count
              print(f"{path}: replaced {count} occurrence(s)")
          print(f"Total replacements in generators: {total}")
          PY

      - name: Regenerar exportaciones de interoperabilidad
        run: npm run data:exports

      - name: Comprobar metadatos canónicos
        run: |
          node scripts/check-canonical-name.mjs
          if git grep -n "Fernando Sandoval Gutiérrez" -- ':!*.md' ':!data/**'; then
            echo "Deprecated responsible-name spelling remains in tracked non-documentary files." >&2
            exit 1
          fi

      - name: Regenerar PDF completo y verificar identidad
        run: |
          python scripts/generate-pdf-exports.py --output .tmp/pdf-canonical
          pdfinfo .tmp/pdf-canonical/raramuri-lexico-completo.pdf >/dev/null
          pdftotext .tmp/pdf-canonical/raramuri-lexico-completo.pdf .tmp/pdf-canonical/raramuri-lexico-completo.txt
          grep -F "Fernando Sandoval Gutierrez" .tmp/pdf-canonical/raramuri-lexico-completo.txt >/dev/null
          if grep -F "Fernando Sandoval Gutiérrez" .tmp/pdf-canonical/raramuri-lexico-completo.txt; then
            echo "Deprecated responsible-name spelling remains in regenerated PDF." >&2
            exit 1
          fi

      - name: Publicar PDF de comprobación
        uses: actions/upload-artifact@v4
        with:
          name: raramuri-pdf-canonical-${{ github.sha }}
          path: |
            .tmp/pdf-canonical/raramuri-lexico-completo.pdf
            .tmp/pdf-canonical/manifest-pdf.json
          retention-days: 30
          if-no-files-found: error

      - name: Incorporar migración a la rama
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/generate-interoperability-exports.mjs scripts/generate-pdf-exports.py public/downloads
            git commit -m "Normalizar nombre canónico en generadores y exportaciones"
            git push origin HEAD:${{ github.head_ref }}
          fi
