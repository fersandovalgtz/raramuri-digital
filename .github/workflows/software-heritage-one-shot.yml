name: Archive in Software Heritage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/software-heritage-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Request archival and wait for SWHID
        id: swh
        shell: bash
        run: |
          set -euo pipefail

          api='https://archive.softwareheritage.org/api/1/origin/save/?visit_type=git&origin_url=https%3A%2F%2Fgithub.com%2Ffersandovalgtz%2Fraramuri-digital'

          echo 'Checking for an existing completed Software Heritage snapshot...'
          existing="$(curl -fsSL -H 'Accept: application/json' "$api" || true)"
          swhid="$(printf '%s' "$existing" | jq -r '[.[]? | select(.snapshot_swhid != null and .snapshot_swhid != "")] | sort_by(.visit_date // .save_request_date) | last | .snapshot_swhid // empty' 2>/dev/null || true)"

          if [[ -z "$swhid" ]]; then
            echo 'No completed snapshot found; submitting Save Code Now request...'
            response="$(curl -fsSL -X POST -H 'Accept: application/json' "$api")"
            echo "$response"
            request_url="$(printf '%s' "$response" | jq -r '.request_url // empty')"
            request_id="$(printf '%s' "$response" | jq -r '.id // empty')"

            if [[ -z "$request_url" && -n "$request_id" ]]; then
              request_url="https://archive.softwareheritage.org/api/1/origin/save/${request_id}/"
            fi
            if [[ -z "$request_url" ]]; then
              echo 'Software Heritage did not return a request URL.' >&2
              exit 1
            fi

            for attempt in $(seq 1 60); do
              sleep 15
              status="$(curl -fsSL -H 'Accept: application/json' "$request_url")"
              task_status="$(printf '%s' "$status" | jq -r '.save_task_status // empty')"
              visit_status="$(printf '%s' "$status" | jq -r '.visit_status // empty')"
              swhid="$(printf '%s' "$status" | jq -r '.snapshot_swhid // empty')"
              echo "Attempt ${attempt}: task=${task_status:-unknown}, visit=${visit_status:-unknown}, swhid=${swhid:-pending}"

              if [[ -n "$swhid" ]]; then
                break
              fi
              if [[ "$task_status" == 'failed' || "$visit_status" == 'failed' || "$visit_status" == 'not_found' ]]; then
                echo "Software Heritage archival failed: $status" >&2
                exit 1
              fi
            done
          fi

          if [[ -z "$swhid" ]]; then
            echo 'No snapshot SWHID was produced within the workflow window.' >&2
            exit 1
          fi

          echo "SWHID=$swhid"
          echo "swhid=$swhid" >> "$GITHUB_OUTPUT"

      - name: Add verified SWHID badge to README
        env:
          SWHID: ${{ steps.swh.outputs.swhid }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          swhid = os.environ['SWHID']

          if 'archive.softwareheritage.org/badge/' in text:
              print('Software Heritage badge already present; leaving README unchanged.')
              raise SystemExit(0)

          lines = text.splitlines()
          insert_at = None
          for i, line in enumerate(lines):
              if 'zenodo.org/badge/DOI/10.5281/zenodo.21483353.svg' in line:
                  insert_at = i + 1
                  break

          if insert_at is None:
              raise SystemExit('Could not locate the DOI badge line in README.md')

          badge = f'  <a href="https://archive.softwareheritage.org/{swhid}"><img src="https://archive.softwareheritage.org/badge/{swhid}/" alt="Software Heritage {swhid}"></a>'
          lines.insert(insert_at, badge)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Inserted Software Heritage badge for {swhid}')
          PY

      - name: Commit README update
        env:
          SWHID: ${{ steps.swh.outputs.swhid }}
        run: |
          if git diff --quiet -- README.md; then
            echo 'README already contains the Software Heritage badge.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: record Software Heritage SWHID ${SWHID} [skip ci]"
          git push
