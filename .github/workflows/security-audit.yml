name: Auditoría npm de seguridad

on:
  push:
    branches:
      - security/npm-audit-2026-08-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-pdf.txt
            requirements-cldf.txt

      - name: Regenerar lockfile candidato
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar dependencias desde lockfile candidato
        run: npm ci

      - name: Auditar árbol completo
        run: npm audit --json > npm-audit-full.json || true

      - name: Auditar sólo producción
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Registrar cadenas vulnerables
        run: npm ls next nanoid postcss sharp drizzle-kit vinext vite wrangler @cloudflare/vite-plugin react-server-dom-webpack --all > npm-vulnerable-tree.txt || true

      - name: Registrar dependencias desactualizadas
        run: npm outdated --json > npm-outdated.json || true

      - name: Instalar herramientas de validación
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils libxml2-utils
          python -m pip install -r requirements-pdf.txt -r requirements-cldf.txt

      - name: Regenerar exportaciones
        run: npm run data:exports

      - name: Verificar nombre canónico del responsable
        run: node scripts/check-canonical-name.mjs

      - name: Validar CLDF con pycldf
        run: python -m pycldf validate public/downloads/cldf/cldf-metadata.json

      - name: Comprobar determinismo CLDF
        run: |
          npm run data:cldf -- --output .tmp/cldf-1
          npm run data:cldf -- --output .tmp/cldf-2
          diff -ru .tmp/cldf-1 .tmp/cldf-2
          python -m pycldf validate .tmp/cldf-1/cldf-metadata.json

      - name: Comprobar determinismo del perfil ortográfico
        run: |
          npm run data:orthography -- --output .tmp/orthography-1
          npm run data:orthography -- --output .tmp/orthography-2
          diff -ru .tmp/orthography-1 .tmp/orthography-2

      - name: Descargar esquema oficial TEI Lex-0
        run: |
          mkdir -p .tmp/tei-lex0
          curl --fail --location --retry 3 --retry-all-errors https://lex-0.org/schema/lex-0.xsd --output .tmp/tei-lex0/lex-0.xsd
          curl --fail --location --retry 3 --retry-all-errors https://lex-0.org/schema/xml.xsd --output .tmp/tei-lex0/xml.xsd

      - name: Validar TEI Lex-0 contra esquema oficial
        run: xmllint --noout --schema .tmp/tei-lex0/lex-0.xsd public/downloads/raramuri-lex0.xml

      - name: Regenerar informe de calidad
        run: npm run data:quality

      - name: Verificar reproducibilidad de datos versionados
        run: git diff --exit-code -- public/downloads QUALITY_REPORT.md

      - name: Probar generador PDF y determinismo
        run: |
          python scripts/generate-pdf-exports.py --output .tmp/pdf-1 --max-entries 25 --no-alphabetical
          python scripts/generate-pdf-exports.py --output .tmp/pdf-2 --max-entries 25 --no-alphabetical
          cmp .tmp/pdf-1/raramuri-lexico-completo.pdf .tmp/pdf-2/raramuri-lexico-completo.pdf
          cmp .tmp/pdf-1/manifest-pdf.json .tmp/pdf-2/manifest-pdf.json
          pdfinfo .tmp/pdf-1/raramuri-lexico-completo.pdf >/dev/null

      - name: Analizar código
        run: npm run lint

      - name: Compilar y probar
        run: npm test

      - name: Exigir cero vulnerabilidades altas en producción
        run: npm audit --omit=dev --audit-level=high

      - name: Publicar evidencia y lockfile candidato
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-remediation-candidate
          path: |
            package-lock.json
            npm-audit-full.json
            npm-audit-production.json
            npm-vulnerable-tree.txt
            npm-outdated.json
          retention-days: 30

      - name: Consolidar lockfile validado en la rama
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya está sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate validated npm lockfile [skip ci]"
          git push origin HEAD:security/npm-audit-2026-08-13
