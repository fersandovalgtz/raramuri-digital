name: Auditoría npm de seguridad

on:
  push:
    branches:
      - security/npm-audit-2026-08-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar árbol completo
        run: npm audit --json > npm-audit-full.json || true

      - name: Auditar sólo producción
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Simular correcciones compatibles sin modificar archivos
        run: npm audit fix --dry-run --json > npm-audit-fix-dryrun.json || true

      - name: Registrar cadenas vulnerables
        run: npm ls @babel/core @cloudflare/vite-plugin @esbuild-kit/core-utils @esbuild-kit/esm-loader brace-expansion drizzle-kit esbuild fast-uri image-size js-yaml miniflare nanoid next postcss react-server-dom-webpack sharp undici vinext vite wrangler ws --all > npm-vulnerable-tree.txt || true

      - name: Registrar dependencias desactualizadas
        run: npm outdated --json > npm-outdated.json || true

      - name: Publicar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: |
            npm-audit-full.json
            npm-audit-production.json
            npm-audit-fix-dryrun.json
            npm-vulnerable-tree.txt
            npm-outdated.json
          retention-days: 30
